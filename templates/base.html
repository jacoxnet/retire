<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags always come first -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>{% block title %}Retirement Calculator{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" href="{% static 'favicon.png' %}">
    
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top" id="mainNav">
        <div class="container">
            <a class="navbar-brand js-scroll-trigger" href="#page-top">Retirement Calculator</a>
            <button class="navbar-toggler navbar-toggler-right" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="fa fa-bars"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav text-uppercase ms-auto">
                    <li class="nav-item">
                        <a class="nav-link js-scroll-trigger {% if request.resolver_match.url_name == 'enter' %}active{% endif %}" href="{% url 'enter' %}">Enter Data</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link js-scroll-trigger {% if request.resolver_match.url_name == 'results' %}active{% endif %}" id="viewResultsNav" href="{% url 'results' %}">Simulation Results</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link js-scroll-trigger {% if request.resolver_match.url_name == 'manage_data' %}active{% endif %}" href="{% url 'manage_data' %}">Save/Load/Clear Data</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <a href="#" id="howToLink" class="how-to-link">How to Use this App</a>
        <br>
        <a href="#" id="feedbackLink" class="feedback-link">Leave Feedback</a>
    </footer>

    {% block extra_js %}
    {% endblock %}

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const viewResultsNav = document.getElementById('viewResultsNav');
            if (viewResultsNav) {
                viewResultsNav.addEventListener('click', function(e) {
                    const simForm = document.getElementById('simulationForm');
                    if (simForm) {
                        e.preventDefault();
                        if (typeof simForm.requestSubmit === 'function') {
                            simForm.requestSubmit();
                        } else {
                            simForm.submit();
                        }
                    }
                });
            }
        });
    </script>
</body>

</html>
